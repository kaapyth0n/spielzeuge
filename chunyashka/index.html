<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#2a1620" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Чуняшка" />
    <meta name="description" content="Чуняшка — вторая игрушка в каталоге Spielzeuge. Скоро." />
    <title>Чуняшка</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/app-180.png" />
  </head>
  <body class="catalog-body" data-lang="ru">
    <button type="button" class="lang-toggle" id="lang-toggle" aria-label="Язык">
      <span class="lang-toggle-glow" aria-hidden="true"></span>
      <span class="lang-toggle-core" aria-hidden="true"></span>
    </button>

    <div class="coming">
      <a class="coming-back" href="../" data-i18n="back">← Spielzeuge</a>
      <p class="coming-kicker" data-i18n="kicker">Чуняшка</p>
      <h1 class="coming-title" data-i18n="title">Скоро</h1>
      <p class="coming-text" data-i18n="text">
        Вторая игрушка в каталоге. Правила и картинки появятся позже — пока здесь только место.
      </p>
      <a class="coming-cta" href="../kuckuck/" data-i18n="cta">Открыть Kuckuck</a>
    </div>

    <div class="lang-sheet" id="lang-sheet" hidden>
      <div class="lang-card" role="dialog" aria-modal="true">
        <p class="lang-card-title" data-i18n="sheet-title">Язык</p>
        <div class="lang-card-langs">
          <button type="button" data-lang="ru" aria-pressed="true">русский</button>
          <button type="button" data-lang="de" aria-pressed="false">Deutsch</button>
          <button type="button" data-lang="en" aria-pressed="false">English</button>
        </div>
        <p class="lang-card-hint" data-i18n="sheet-hint">
          Удерживайте кнопку языка, чтобы выбрать сразу.
        </p>
      </div>
    </div>

    <script type="module" src="/src/catalog.ts"></script>
  </body>
</html>
