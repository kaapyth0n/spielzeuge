<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#2a1620" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Чуняшка" />
    <meta
      name="description"
      content="Чуняшка — детская одевалка. Всегда в одежде. Лайки только в игре."
    />
    <title>Чуняшка</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/app-180.png" />
  </head>
  <body class="chun-body" data-lang="ru">
    <a class="chun-back" href="../" data-i18n="back">← Spielzeuge</a>
    <button type="button" class="lang-toggle" id="lang-toggle" aria-label="Язык">
      <span class="lang-toggle-glow" aria-hidden="true"></span>
      <span class="lang-toggle-core" aria-hidden="true"></span>
    </button>

    <div class="chun">
      <div class="stage" id="doll-stage"></div>

      <div class="tray">
        <div class="slots" id="groups">
          <button type="button" class="slot" data-group="hair">Волосы</button>
          <button type="button" class="slot" data-group="face">Лицо</button>
          <button type="button" class="slot is-on" data-group="clothes">Одежда</button>
          <button type="button" class="slot" data-group="shoes">Обувь</button>
        </div>
        <div class="slots slots--sub" id="subs" hidden>
          <button type="button" class="slot" data-slot="hair">Фасон</button>
          <button type="button" class="slot" data-slot="color">Цвет</button>
          <button type="button" class="slot" data-slot="eyes">Глаза</button>
          <button type="button" class="slot" data-slot="brows">Брови</button>
          <button type="button" class="slot" data-slot="smile">Улыбка</button>
          <button type="button" class="slot" data-slot="cheeks">Щёки</button>
        </div>
        <div class="chips" id="chips"></div>
        <button type="button" class="ready" id="ready" data-i18n="ready">Готово</button>
      </div>
    </div>

    <div class="photo" id="photo" hidden>
      <div class="photo-card">
        <div class="photo-stage" id="photo-stage"></div>
        <p class="likes" id="like-label" aria-label="Сердечки">
          ♥ <span id="like-count">0</span>
        </p>
        <div class="heart-rain" id="heart-rain" aria-hidden="true"></div>
        <button type="button" class="again" id="again" data-i18n="again">Ещё раз</button>
      </div>
    </div>

    <div class="lang-sheet" id="lang-sheet" hidden>
      <div class="lang-card" role="dialog" aria-modal="true">
        <p class="lang-card-title" data-i18n="sheet-title">Язык</p>
        <div class="lang-card-langs">
          <button type="button" data-lang="ru" aria-pressed="true">русский</button>
          <button type="button" data-lang="de" aria-pressed="false">Deutsch</button>
          <button type="button" data-lang="en" aria-pressed="false">English</button>
        </div>
        <p class="lang-card-hint" data-i18n="sheet-hint">
          Удерживайте кнопку языка, чтобы выбрать сразу.
        </p>
      </div>
    </div>

    <script type="module" src="/src/chunyashka.ts"></script>
  </body>
</html>
