<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#2a1620" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Spielzeuge" />
    <meta
      name="description"
      content="Spielzeuge — quiet toys for small hands. Pick a game."
    />
    <title>Spielzeuge</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/app-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body class="catalog-body">
    <div id="catalog" class="catalog">
      <header class="catalog-head">
        <p class="catalog-kicker">Spielzeuge</p>
        <h1 class="catalog-title">Выбери игру</h1>
        <p class="catalog-sub">Спокойные игрушки. Без счёта. Без проигрыша.</p>
      </header>

      <nav class="catalog-grid" aria-label="Игры">
        <a class="toy-card toy-card--kuckuck" href="./kuckuck/">
          <span class="toy-card-art" aria-hidden="true">
            <span class="toy-card-door"></span>
          </span>
          <span class="toy-card-body">
            <span class="toy-card-name">Kuckuck</span>
            <span class="toy-card-blurb">Дверь стучит. Открой — там гость.</span>
          </span>
        </a>

        <a class="toy-card toy-card--chunyashka" href="./chunyashka/">
          <span class="toy-card-art" aria-hidden="true">
            <span class="toy-card-soft"></span>
          </span>
          <span class="toy-card-body">
            <span class="toy-card-name">Чуняшка</span>
            <span class="toy-card-blurb">Скоро. Пока только имя на двери.</span>
          </span>
        </a>
      </nav>
    </div>
    <script type="module" src="/src/catalog.ts"></script>
  </body>
</html>
